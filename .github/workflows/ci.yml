# Continuous integration: build every configuration, verify what can be verified.
#
# ############################################################################
# HOW THE TOOLCHAIN IS INSTALLED, and why it is not the obvious way.
#
# Five install routes were tried and measured on a runner before this one:
#
#   1. the -dll.exe installer via Start-Process -ArgumentList @("/S","/D=...")
#      hung to the full job timeout.  NSIS re-quotes array elements, so /D arrives
#      quoted and the installer opens a directory prompt and waits for a human
#      instead of failing.
#   2. the same through `cmd /c`, which works on a machine that ALREADY has
#      ImageMagick (verified locally: exit 0 in 23.9s) and still hangs on a clean
#      runner.  The uncontrolled variable was a prior install, which is exactly why
#      the local test passed and the real thing did not.  A local reproduction of a
#      clean-machine failure has to be run on a clean machine.
#   3. the portable-Q16-HDRI-x64.7z extracts in 0.9s and is RUNTIME ONLY -- 23 loose
#      files, magick.exe and XML, with no include/ and no lib/ anywhere.
#   4. `7z x` on the installer exe yields the NSIS bootstrap only; the payload is in
#      an embedded blob 7z does not unpack.
#   5. `choco install imagemagick` reports "v7.1.2.2500 already installed", i.e. it
#      IS the runtime-only copy from route 1 above.
#
# What DOES work is conda, and the runner image is irrelevant to it:
#
#   pwsh -File tools/install-imagemagick.ps1
#
# Twenty-one seconds, exit 0, no GUI, and it carries the same version this
# repository is pinned to (7.1.2-31 Q16-HDRI x86_64) with 1,459 headers and the
# MSVC import libraries MagickCore-7.Q16HDRI.dll.lib and
# MagickWand-7.Q16HDRI.dll.lib.  Its magick reports "Compiler: Visual Studio
# 2022", which is the part that matters: a conda build could in principle be
# MinGW-ABI, and the import libraries would then be unlinkable by MSVC.
#
# Verified on this machine before it was pushed here: a clean clone built against
# that prefix, the smoke test reported AE=0/4096 RMSE=0 -- bit-exact against
# conda's own magick -- and the full suite reported 90 passed, 0 failed, 45
# skipped.  Those are exactly the numbers the nocuda job asserts below.
#
# Two differences from the official Windows layout, both handled by CMakeLists.txt
# and build.cmd rather than patched here:
#   * headers live under Library\include\ImageMagick-7, and the import libraries
#     are named MagickCore-7.Q16HDRI.dll.lib rather than CORE_RL_MagickCore_.lib;
#   * the DLLs are in Library\bin and there are 224 of them, the core one versioned
#     (MagickCore-7.Q16HDRI-10.dll), so they go on PATH instead of being copied.
#
# LICENCE.  The conda-forge build is declared "AGPL-3.0-only AND ImageMagick".
# AGPLv3 is compatible with this project's GPL-3.0-or-later, so linking against it
# is fine, and it is a build-time dependency on a runner rather than something
# redistributed.  Stated rather than assumed, because it is the sort of thing that
# is easy to miss and awkward to discover later.
#
# WHY THIS EXISTS AT ALL, and it is not "to be professional".
#
# Five defects were found in one session, and every one of them had the same cause:
# a build configuration that nobody had ever run.  A clean clone did not link.
# `build.cmd --no-cuda` did not compile.  Three separate scripts reported an absent
# engine as a test FAILURE, so a CPU-only build exited 1 on a suite that was entirely
# green.  The OpenCL SDK was searched for in one directory while the comment beside it
# promised three others.  A documented .txt palette was rejected on the video path with
# a message that blamed the file.
#
# Every other check passed the whole time -- 135 bit-exact cases, anchors, 56
# documented flags, the licence byte-compare, a secrets sweep across every commit --
# and NOT ONE of them could have caught any of those five.  Only building a clean
# clone could.  This workflow builds a clean clone on every push, on a machine that is
# not the one the code was written on.
#
# WHAT THIS RUNS ON, and why it is the right shape.  GitHub's hosted Windows runners
# have NO GPU and NO OpenCL SDK, which is precisely the configuration that was broken
# three separate ways.  That is not a limitation worked around; it is the reason this
# catches things.  What it therefore CANNOT do is run the OpenCL-vs-CUDA sweep or the
# video probes, and it does not pretend to: those report as skipped, which is a
# distinct outcome from passing and is never counted as a pass.
#
# COSTS about 6-8 minutes per push.  If that is too much, delete the cuda job -- the
# nocuda job alone catches three of the five defects, and the cuda job is the one
# that only checks compilation.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run in progress.  Without this, a burst of
# commits queues five six-minute builds to answer a question the newest commit already
# answers.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nocuda:
    # The highest-value job in this file, and the one to keep if you keep only one.
    # No GPU on the runner, so this takes exactly the code path that failed to link.
    name: build + verify (no CUDA, no OpenCL SDK)
    runs-on: windows-2022
    # 40, for ONE full verify.ps1 run.  verify.ps1's own header documents the sweep at
    # 25-35 min, so 25 was below its own documented floor even before this file ran the
    # suite twice; two runs would need roughly 50-70.  Not measured on a runner, so this
    # is headroom against a documented range rather than a measurement.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick 7.1.2-31 Q16-HDRI
        shell: pwsh
        # The conda route, in a shared script so the two jobs cannot drift apart.
        # Why the official installer is not used is recorded in the header and in
        # tools/install-imagemagick.ps1 itself.  The script asserts the prefix is
        # buildable rather than trusting that "exit 0" means usable.
        run: pwsh -NoProfile -File .\tools\install-imagemagick.ps1 -Prefix C:\im
      - name: Install ffmpeg
        shell: pwsh
        # The hosted runners have NO ffmpeg, so every video check in verify.ps1
        # reported SKIPPED.  That is not a cosmetic gap: the video path is where the
        # --cpu-threads 0 access violation lived, and nothing in CI could have seen it
        # because the code was never reached.
        #
        # A pinned portable build rather than an installer, for the same reason
        # ImageMagick uses one here: an installer that can prompt is an installer that
        # eventually hangs a job.  Verified locally before being pushed: exit 0, and the
        # script asserts ffmpeg and ffprobe both run and that the libx264 and ffv1
        # encoders the pipeline asks for by name are present.
        run: pwsh -NoProfile -File .\tools\install-ffmpeg.ps1 -Prefix C:\ffmpeg
      - name: Report the toolchain actually used
        shell: pwsh
        run: |
          magick --version
          cmake --version
          # Recorded in the log because a green run on an unexpected toolchain is not
          # the same evidence as a green run on the expected one.
          Write-Host "runner: $env:RUNNER_OS $env:RUNNER_ARCH"

      - name: Build (CPU only)
        shell: cmd
        run: build.cmd --no-cuda

      - name: Verify, and assert the skipped checks are the expected ones
        shell: pwsh
        # ONE run of the suite, not two.  This used to be two steps: a "Verify" step
        # that ran verify.ps1 and checked its exit code, and an "Assert the skipped
        # checks" step that ran it AGAIN and scraped the bit-exact tally out of a
        # Tee-Object log of the second run.  Half the point of a tally is that it
        # describes the run whose exit code you checked; a tally read from a different
        # run than the one that was allowed to fail is a tally about nothing.
        #
        # The duplicate was also the reason this job could not fit its own timeout.
        # verify.ps1's own header documents the full sweep at 25-35 min, and two full
        # runs therefore need roughly 50-70 min against `timeout-minutes: 25` below.
        # I have not measured a full verify.ps1 run on a runner, so I cannot say which
        # of those two shapes was actually happening there -- only that the second run
        # started with at most 25 minutes of budget left, and a suite slower than
        # 25 minutes could not have completed twice.  The job now does it once, and the
        # timeout has room for one.
        #
        # Guards against a silent hole.  verify.ps1 reports a check it cannot run as
        # skipped, and a skipped check is not a pass -- but that convention also means
        # a suite could skip EVERYTHING and exit 0, which would be a green light that
        # means "I looked away".  So the count of real passes is asserted here, and it
        # is asserted to be the number the no-CUDA configuration can actually produce.
        #
        # 100, not 150: 10 images x 5 colour counts x 3 engines is 150, and the cuda
        # engine's 50 are skipped on a runner with no GPU.  Verified locally on this
        # configuration: "100 passed, 0 failed, 50 SKIPPED", exit 0.
        #
        # The tenth image is the JPEG fixture.  It was added because every previous
        # fixture was a PNG, and a PNG cannot reach the coder-inheritance defect where
        # a .png destination received JPEG bytes.  Ten images where nine would do is
        # the cost of that being covered automatically from now on.
        #
        # If someone later fixes the engine reporting, this number goes UP and the
        # assertion has to be updated -- which is the intended direction to be forced
        # into noticing.
        #
        # $LASTEXITCODE after `... *>&1 | Tee-Object` is the CHILD's exit code, not
        # Tee-Object's: measured here with a child that exits 0, 1 and 2 respectively,
        # and read back as 0, 1 and 2.  So the single run can be both tee'd and checked.
        # The tally regex was also measured against a Tee-Object log of a nested
        # `pwsh -File` child, which is the shape that actually matters here: Write-Host
        # writes to the information stream, `*>&1` folds that into stream 1, and the
        # regex matched.  It can match.  (2>&1 alone also captures it, but *>&1 also
        # keeps the probes' stderr in the log, which is worth having.)
        run: |
          $ErrorActionPreference = 'Continue'
          # magick, MAGICK_HOME and the DLL directory are already set by the
          # install step through GITHUB_ENV and GITHUB_PATH, so they are not
          # re-derived here: in this layout magick.exe lives in Library\bin, not
          # at the prefix root, so "$env:IM_ROOT\magick.exe" is not a file.
          magick --version
          $log = 'verify.log'
          & pwsh -NoProfile -File .\verify.ps1 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "verify.ps1 exit=$code"
          if ($code -ne 0) { Write-Host "verify.ps1 FAILED (exit $code)"; exit $code }
          $text = Get-Content $log -Raw

          # No stage may have been skipped outright.  A probe that reports itself
          # SKIPPED is a different thing -- the bit-exact tally below counts those --
          # but a stage verify.ps1 did not RUN at all (its -Fast path) used to print
          # one yellow line and exit 0.  verify.ps1 now prints a `coverage:` line and
          # exits 2 when that happens; this asserts the line, so the two cannot drift
          # and a future edit that reintroduces a silent skip fails here rather than
          # being noticed in a log nobody reads.
          $cov = [regex]::Match($text, 'coverage: every stage ran\.\s+0 skipped\.')
          if (-not $cov.Success) {
            Write-Host "verify.ps1 did not report 'coverage: every stage ran. 0 skipped.'"
            Write-Host "A stage was skipped outright, which is not the same as a probe"
            Write-Host "reporting itself SKIPPED, and this job does not run -Fast."
            exit 1
          }

          $m = [regex]::Match($text, 'bit-exact cases:\s*(\d+) passed,\s*(\d+) failed(?:,\s*(\d+) SKIPPED)?')
          if (-not $m.Success) { Write-Host "could not find the bit-exact tally in the output"; exit 1 }
          $passed = [int]$m.Groups[1].Value
          $failed = [int]$m.Groups[2].Value
          Write-Host "tally: $passed passed, $failed failed"
          if ($failed -ne 0) { exit 1 }
          if ($passed -lt 90) {
            Write-Host "only $passed cases ran -- that is far below the 100 this configuration can do."
            Write-Host "A suite that skips nearly everything and exits 0 is worse than a failing one."
            exit 1
          }
          Write-Host "OK: $passed real bit-exact cases passed on a GPU-less runner"

  cuda:
    # Compilation only in practice: nvcc compiles and links without a device, so this
    # verifies the CUDA build is not broken, and then verify.ps1 reports the GPU checks
    # as skipped.  Kept separate from the job above so that a CUDA toolchain problem
    # does not hide a plain C++ problem, and so either can be dropped independently.
    name: build (CUDA toolkit, no GPU)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick 7.1.2-31 Q16-HDRI
        shell: pwsh
        # The conda route, in a shared script so the two jobs cannot drift apart.
        # Why the official installer is not used is recorded in the header and in
        # tools/install-imagemagick.ps1 itself.  The script asserts the prefix is
        # buildable rather than trusting that "exit 0" means usable.
        run: pwsh -NoProfile -File .\tools\install-imagemagick.ps1 -Prefix C:\im
      - name: Install ffmpeg
        shell: pwsh
        # The hosted runners have NO ffmpeg, so every video check in verify.ps1
        # reported SKIPPED.  That is not a cosmetic gap: the video path is where the
        # --cpu-threads 0 access violation lived, and nothing in CI could have seen it
        # because the code was never reached.
        #
        # A pinned portable build rather than an installer, for the same reason
        # ImageMagick uses one here: an installer that can prompt is an installer that
        # eventually hangs a job.  Verified locally before being pushed: exit 0, and the
        # script asserts ffmpeg and ffprobe both run and that the libx264 and ffv1
        # encoders the pipeline asks for by name are present.
        run: pwsh -NoProfile -File .\tools\install-ffmpeg.ps1 -Prefix C:\ffmpeg
      - name: Install the CUDA toolkit
        shell: pwsh
        # The hosted runners have MSBuild and the VS C++ workload but NOT nvcc, and
        # `find_package(CUDAToolkit REQUIRED)` in CMakeLists.txt makes its absence a
        # configure error rather than a graceful skip.
        #
        # These are the component REDIST archives, not the 4 GB installer, so each URL
        # was read out of NVIDIA's own manifest for 12.8.1 and then fetched to confirm
        # it resolves:
        #   https://developer.download.nvidia.com/compute/cuda/redist/redistrib_12.8.1.json
        # A hand-written guess at that path 404s.  The version numbers are the component
        # versions WITHIN the 12.8.1 release, which is why nvcc is 12.8.93 and not
        # 12.8.1 -- that mismatch looks like a typo and is not one.
        #
        # cuda_cccl is included because nvcc's own headers include thrust/cub, so a
        # toolkit without it fails at compile time rather than at configure time.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $parts = @(
            'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.8.93-archive.zip',
            'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.8.90-archive.zip',
            'cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.8.90-archive.zip'
          )
          $root = "$env:RUNNER_TEMP\cuda"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($p in $parts) {
            $name = ($p -split '/')[-1]
            $zip = Join-Path $env:RUNNER_TEMP $name
            Write-Host "fetching $name"
            # Retried: these are 115 MB / 2.9 MB / 2.8 MB fetches, and a single
            # dropped connection on a hosted runner fails the whole job.  The retry is
            # here because that happened locally during this fix.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri "$base/$p" -OutFile $zip -UseBasicParsing -TimeoutSec 1800
                break
              } catch {
                Write-Host "  attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -eq 3) { throw "could not fetch $name after 3 attempts" }
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            # Extract into its own scratch directory FIRST, then copy the contents of
            # the single top-level folder the archive contains into $root.
            #
            # Each archive nests one directory deep, so extracting straight into a
            # shared root leaves three sibling trees instead of one, and
            # find_package(CUDAToolkit) never finds bin/ include/ lib/x64/ together.
            $scratch = Join-Path $env:RUNNER_TEMP ("unpack_" + [IO.Path]::GetFileNameWithoutExtension($name))
            if (Test-Path $scratch) { Remove-Item $scratch -Recurse -Force }
            Expand-Archive -Path $zip -DestinationPath $scratch -Force
            $inner = Get-ChildItem $scratch -Directory | Select-Object -First 1
            if (-not $inner) { throw "archive $name contained no top-level directory" }
            # Copy the CONTENTS of the inner directory, not the directory itself, so
            # bin/, include/ and lib/ land directly in $root.
            Copy-Item (Join-Path $inner.FullName '*') $root -Recurse -Force
            Remove-Item $scratch -Recurse -Force
          }

          # Find nvcc by RECURSION, not by assuming a fixed depth.  The previous
          # version looked only at immediate children of the stage directory and so
          # never matched; it then printed the path it had just found and threw
          # "not found" anyway, which is the most confusing possible way to fail.
          $nvcc = Get-ChildItem $root -Recurse -Filter 'nvcc.exe' -File | Select-Object -First 1
          if (-not $nvcc) {
            Write-Host "tree under $root :"
            Get-ChildItem $root -Recurse -Directory | Select-Object -First 30 |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw 'nvcc.exe not found in any unpacked component'
          }
          # The toolkit root is nvcc's grandparent: <root>/bin/nvcc.exe.
          $cudaRoot = $nvcc.Directory.Parent.FullName
          Write-Host "nvcc at: $($nvcc.FullName)"
          Write-Host "CUDA root: $cudaRoot"

          # Assert the MERGED tree before handing it to CMake.  These three are what
          # CMakeLists.txt and nvcc actually need, and each was missing in a run that
          # got as far as a build:
          #   include/cuda_runtime.h  from cuda_cudart
          #   lib/x64/cudart.lib      from cuda_cudart
          #   bin/nvcc.exe            from cuda_nvcc
          # Checking here means a merge failure names the file instead of surfacing as
          # an undefined-symbol link error twenty steps later.
          $need = @(
            @{ Path = (Join-Path $cudaRoot 'include\cuda_runtime.h'); What = 'cuda_runtime.h' },
            @{ Path = (Join-Path $cudaRoot 'lib\x64\cudart.lib');    What = 'cudart.lib' },
            @{ Path = (Join-Path $cudaRoot 'bin\nvcc.exe');           What = 'nvcc.exe' }
          )
          foreach ($n in $need) {
            if (-not (Test-Path $n.Path)) {
              Write-Host "MISSING: $($n.What) at $($n.Path)"
              Write-Host "top level of ${cudaRoot}:"
              Get-ChildItem $cudaRoot -EA SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
              throw "$($n.What) missing -- the component archives did not merge"
            }
            Write-Host "  [ok] $($n.What)"
          }
          & $nvcc.FullName --version
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          ("{0}\bin" -f $cudaRoot) >> $env:GITHUB_PATH
          ("{0}\lib\x64" -f $cudaRoot) >> $env:GITHUB_PATH
          ("{0}\include" -f $cudaRoot) >> $env:GITHUB_PATH

      - name: Build (CUDA)
        shell: cmd
        # No env: block.  IMAGEMAGICK_ROOT is already in GITHUB_ENV from the install
        # step, set to the root the archive actually unpacked to.  Hardcoding C:\im
        # here was wrong the moment the portable archive was adopted, because that is
        # the extraction target, not necessarily the root inside it.
        run: build.cmd

      - name: Report what this run could and could not check
        shell: pwsh
        run: |
          Write-Host "This job has the CUDA toolkit but NO GPU."
          Write-Host "It proves the CUDA build compiles and links.  It cannot run the"
          Write-Host "OpenCL-vs-CUDA sweep or the video probes, and those stay manual."
          & .\build\Release\rdither.exe --list-dithers

  # ############################################################################
  # LINUX.  Added because OpenCL is the PRIMARY accelerated path on Linux -- there
  # is no CUDA there at all, and Intel/AMD iGPU need it -- so "the project does not
  # build on Linux" was a real gap rather than a cosmetic one.  Every other job in
  # this file runs on windows-2022, which means the clean-clone build had only ever
  # been proven on the platform it was written on.  That is the same cause as the
  # five defects in the header: a configuration nobody ran.
  #
  # runs-on: ubuntu-latest is a REAL Linux VM -- real kernel, real apt, real
  # compiler.  It is not emulation and not a cross-compile.
  #
  # WHAT IS EXPECTED TO FAIL, and why this job reports it rather than hiding it.
  #
  # THE BLOCKER HAS MOVED TWICE, and this comment tracked the first one for a commit
  # after it stopped being true.  Recording that, because the failure mode is the point:
  #
  #   1. CMakeLists.txt knew only `windows` and `conda`, both wanting MSVC import
  #      libraries (CORE_RL_MagickCore_.lib, magick.exe, *.dll).  A Linux
  #      ImageMagick ships libMagickCore-7.Q16HDRI.so, no .exe, no DLLs, and Ubuntu
  #      24.04 ships ImageMagick 6 anyway -- so there was nothing to write a flavour
  #      for.  FIXED: the runner builds IM7 Q16-HDRI from source, and CMakeLists.txt
  #      has a `linux` flavour.  Configure now completes.
  #
  #   2. THE CURRENT BLOCKER, and it is the source, not the build system: five files
  #      include <windows.h> unconditionally -- rd_source.cpp, rd_checkpoint.cpp,
  #      rd_progress.cpp, rd_cli.cpp, rd_video.cpp -- and the Windows API surface is
  #      not merely headers.  CreateFileMapping wants mmap, GetConsoleMode wants
  #      isatty/termios.  rd_source.cpp:6 is where the build stops.
  #
  # `continue-on-error` stays for the same reason either way: a hard failure on an
  # unsupported platform turns every push red and trains everyone to ignore the job.
  # The step does not hide the outcome -- it writes the real reason into the run
  # summary and names which of the two blockers above it is.
  #
  # WHEN IT DOES PASS, this becomes a real gate and `continue-on-error` comes off.
  # That is what writing it this way is for.
  #
  # WHY IT STILL RUNS THE SUITE rather than only compiling.  A build that links is
  # the least interesting thing this job could check.  Bit-exactness against
  # ImageMagick is the project's core claim, and it has never been tested against a
  # Linux ImageMagick.  If the two disagree, that is the single most important
  # thing anyone could learn about this project, and it is learnable here.
  linux:
    name: build + verify (Linux, no CUDA, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # See above: a not-yet-supported platform must not turn every push red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        # ImageMagick 7 dev headers, ffmpeg, and pocl.  pocl is the reason the
        # OpenCL engine can be exercised at all here: it provides a working
        # OpenCL-on-CPU ICD, so `--engine opencl` runs for real rather than
        # reporting the engine absent.  That makes this the only runner in this
        # file that can execute OpenCL code, and OpenCL is the primary Linux path.
        #
        # The package name for the dev headers has moved across Ubuntu releases;
        # the fallback keeps a release rename from failing the job for a reason
        # that has nothing to do with this project.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            imagemagick libmagickwand-dev ffmpeg pocl-opencl-icd clinfo \
          || sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            imagemagick libmagick-dev ffmpeg pocl-opencl-icd clinfo
          echo "--- versions ---"
          cmake --version | head -1
          (c++ --version || g++ --version) | head -1
          magick --version | head -2
          ffmpeg -version | head -1

      - name: Build ImageMagick 7 Q16-HDRI from source
        # WHY FROM SOURCE, and not from apt.  The previous version of this job
        # installed libmagickwand-dev and fell back to libmagick-dev, and the log
        # said what that actually got:
        #
        #     libmagickcore-6.q16-dev  libmagickwand-6-head...
        #
        # Ubuntu 24.04 (noble) ships IMAGE MAGICK 6.  This project targets ImageMagick
        # 7: MagickCore/MagickCore.h, the single `magick` multi-tool binary, and
        # Q16-HDRI.  So the apt route cannot supply the thing bit-exactness is defined
        # against, and a `linux` FLAVOUR written against the distro package would be
        # a flavour for the wrong major version.
        #
        # Q16-HDRI specifically, because the whole suite is a bit-exactness comparison
        # against this library and quantum depth is not a detail: 8-bit and 16-bit
        # quantise differently, and an HDRI build differs from a non-HDRI one in
        # rounding.  A Linux check against the wrong build would be worse than none,
        # because it would compare against a reference the project does not target.
        #
        # Pin the tag rather than tracking main.  The Windows job pins 7.1.2-31; this
        # pins the same series, so a Linux-vs-Windows disagreement is about the
        # platform rather than about two different library versions.
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends \
            git libtool pkg-config \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev liblzma-dev \
            libxml2-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev \
            libheif-dev libraw-dev libexif-dev
          IM=ImageMagick
          TAG=7.1.2-31
          git clone --depth 1 --branch "$TAG" https://github.com/ImageMagick/ImageMagick.git im-src
          cd im-src
          ./configure --prefix=/opt/im --with-quantum-depth=16 --with-hdri=yes \
            --without-perl --without-x --disable-openmp \
            --with-modules=no --with-magick-plus-plus=no
          make -j"$(nproc)"
          make install
          cd ..
          echo "--- the build we actually got ---"
          /opt/im/bin/magick -version | head -3
          # Assert it is 7 and Q16, not merely that it exists.  A quiet fall back to
          # IM6 would otherwise produce a green run comparing against the wrong library.
          /opt/im/bin/magick -version | grep -q "ImageMagick 7" || { echo "not ImageMagick 7"; exit 1; }
          /opt/im/bin/magick -version | grep -qE "Q16" || { echo "not Q16"; exit 1; }
          test -f /opt/im/include/ImageMagick-7/MagickCore/MagickCore.h || {
            echo "no MagickCore.h under /opt/im/include"; ls -R /opt/im/include | head -40; exit 1; }
          echo "IMAGEMAGICK_ROOT=/opt/im" >> "$GITHUB_ENV"
          echo "/opt/im/bin" >> "$GITHUB_PATH"
          echo "/opt/im/lib" >> "$GITHUB_PATH"

      - name: Report what this runner actually provides
        # A REPORTING STEP MUST NEVER BE ABLE TO FAIL THE BUILD.  This one did, on its
        # first run: `magick -version` exited non-zero because libmagickwand-dev
        # installs the LIBRARY and the `magick` CLI is a separate package, so under
        # `bash -e` the step died BEFORE build.sh ever ran.  The job then reported
        # `if [ "skipped" = "success" ]` -- accurate, and useless, because it
        # described a step that had not been attempted.
        #
        # So `set +e` here, and every probe below ends in `|| true`.  A toolchain
        # that differs from expectations is information to print, not a reason to stop:
        # the next step is the one that judges anything.
        run: |
          set +e
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "--- OpenCL platforms (pocl is OpenCL-on-CPU; that is the point) ---"
          clinfo -l 2>/dev/null || echo "clinfo found no platform (opencl stage will skip)"
          echo "--- ImageMagick facts that matter for bit-exactness ---"
          magick -version 2>&1 | head -4 || echo "magick CLI not found"
          magick identify -list format 2>&1 | grep -i -E "(PNG|JPEG)" || echo "(format list unavailable)"

      - name: Build
        id: build
        # `./build.sh`, not `bash build.sh`: the file is committed mode 755, and
        # invoking it through the interpreter would hide a lost executable bit
        # instead of reporting it.
        run: |
          set +e
          ./build.sh --no-cuda 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          echo "build.sh exit=$rc" | tee -a build-linux.log
          exit $rc

      - name: Record the outcome honestly
        # This step runs whether or not the build did, which is the whole design.
        # A failure here writes the real reason into the run summary instead of
        # leaving it in a log scroll, and a success says plainly that it is not
        # yet a claim about Linux support.
        if: always()
        run: |
          {
            echo "### Linux build"
            echo
          # Three outcomes, not two.  The first run produced "skipped" because an
          # EARLIER step failed first, and the else branch then said "build.sh failed"
          # -- which was false, and worse than useless: it named a cause that had not
          # been tried.  A summary that blames the wrong step is the same defect as a
          # check whose standard was authored from a different configuration.
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "build.sh configured and compiled on ubuntu-latest."
            echo
            echo "**This is not yet a claim that Linux is supported.** The ImageMagick"
            echo "flavour CMakeLists.txt understands is \`windows\` or \`conda\`, both of"
            echo "which expect MSVC import libraries. If this step passed, either a"
            echo "\`linux\` flavour has been added since this job was written, or the"
            echo "build succeeded without linking ImageMagick. Check which."
          elif [ "${{ steps.build.outcome }}" = "skipped" ]; then
            echo "**build.sh was never run.** A step before it failed, so this says"
            echo "nothing about Linux and nothing about build.sh. Read the step above"
            echo "this one for the real cause."
          else
              echo "build.sh configured and compiled on ubuntu-latest."
              echo
              echo "**This is not yet a claim that Linux is supported.** The ImageMagick"
              echo "flavour CMakeLists.txt understands is \`windows\` or \`conda\`, both of"
              echo "which expect MSVC import libraries. If this step passed, either a"
              echo "\`linux\` flavour has been added since this job was written, or the"
              echo "build succeeded without linking ImageMagick. Check which."
            else
              echo "build.sh failed, which is the EXPECTED outcome on a machine with no"
              echo "POSIX port of this source tree yet."
              echo
              echo "WHAT IS DONE: ImageMagick 7 Q16-HDRI builds from source on the runner,
              echo "and CMakeLists.txt has a \`linux\` flavour for it. Both landed, and the
              echo "configure step completes."
              echo
              echo "WHAT IS NOT DONE: the source is Windows-only. Five files include"
              echo "windows.h unconditionally, and the Windows API surface is not just
              echo "headers -- CreateFileMapping needs mmap, GetConsoleMode needs isatty /
              echo "termios. So this job stops at the first such include, which is"
              echo "src/rd_source.cpp:6. The build log above names the exact line."
              echo
              echo "This text was written when the blocker was the missing CMake
              echo "flavour, and it stayed after that was fixed. A summary naming a
              echo "blocker that no longer exists sends the next reader after the wrong
              echo "thing."
              echo
              echo '```'
              tail -40 build-linux.log 2>/dev/null || echo "(no build log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify, if the binary exists
        # Runs the suite only when there is something to run it against.  The
        # tally is NOT asserted against a fixed number, unlike the Windows job,
        # because this configuration has never produced one: there is no Linux
        # baseline to assert against, and inventing one would be the "standard
        # authored from a number from a different configuration" failure again.
        # What is asserted is the weaker, honest thing: zero failures, and a
        # coverage line that says nothing was skipped outright.
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'verify-linux.log'
          & pwsh -NoProfile -File ./verify.ps1 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "verify.ps1 exit=$code"
          $text = Get-Content $log -Raw
          $cov = [regex]::Match($text, 'coverage: every stage ran\.\s+0 skipped\.')
          if (-not $cov.Success) {
            Write-Host "verify.ps1 did not report full coverage; stages were skipped."
            Write-Host "Expected on a runner with no GPU: the GPU engines report themselves"
            Write-Host "skipped, which is a distinct outcome and is counted, not waved through."
          }
          $m = [regex]::Match($text, 'bit-exact cases:\s*(\d+) passed,\s*(\d+) failed')
          if (-not $m.Success) { Write-Host "could not find the bit-exact tally"; exit 1 }
          $passed = [int]$m.Groups[1].Value
          $failed = [int]$m.Groups[2].Value
          Write-Host "tally: $passed passed, $failed failed"
          if ($failed -ne 0) { exit 1 }
          if ($passed -lt 1) {
            Write-Host "only $passed case ran -- nothing was actually checked."
            exit 1
          }
          Write-Host "OK: $passed bit-exact cases against a LINUX ImageMagick."
          Write-Host "That is the first time this project's core claim has been tested"
          Write-Host "against a non-Windows ImageMagick."
