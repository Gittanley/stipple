# Continuous integration: build every configuration, verify what can be verified.
#
# ############################################################################
# THIS WORKFLOW HAS NEVER SUCCESSFULLY BUILT THIS REPOSITORY.
#
# It is blocked on ImageMagick, after six runs that each established one measured
# fact.  Recorded here rather than in the commit log alone, because they cost about
# forty minutes of CI to acquire and nobody should pay that again.
#
# GitHub's hosted Windows runners DO ship ImageMagick:
#
#   C:\Program Files\ImageMagick-7.1.2-Q16-HDRI\magick.exe
#   Version: ImageMagick 7.1.2-25 Q16-HDRI x64
#
# which is the right variant and the path build.cmd looks in first.  But it is
# RUNTIME ONLY.  Measured on a runner:
#
#   include\MagickCore\MagickCore.h   -> False
#   lib\CORE_RL_MagickCore_.lib       -> False
#
# Nothing can link against it.  `magick` itself works, so it is usable as the compare
# reference verify.ps1 needs; it cannot be built against.
#
# FIVE INSTALL ROUTES, ALL MEASURED ON A RUNNER, ALL DEAD ENDS:
#
#   1. the -dll.exe installer via Start-Process -ArgumentList @("/S","/D=...")
#      hung to the full job timeout.  NSIS re-quotes array elements, so /D arrives
#      quoted and the installer opens a directory prompt and waits for a human instead
#      of failing.
#   2. the same through `cmd /c`, which works on a machine that ALREADY has ImageMagick
#      (verified locally: exit 0 in 23.9s) and still hangs on a clean runner.  The
#      uncontrolled variable was a prior install, which is exactly why the local test
#      passed and the real thing did not.  That is the mistake worth remembering: a
#      local reproduction of a clean-machine failure, run on a machine that was not
#      clean.
#   3. the portable-Q16-HDRI-x64.7z extracts in 0.9s and is runtime only -- 23 loose
#      files, magick.exe and XML, with no include/ and no lib/ anywhere in the tree.
#   4. `7z x` on the installer exe yields the NSIS bootstrap only; the payload is in an
#      embedded blob 7z does not unpack.
#   5. `choco install imagemagick` reports "v7.1.2.2500 already installed", i.e. it IS
#      the runtime-only copy from route 1 above.
#
# ImageMagick publishes four forms of the Windows x64 build -- portable 7z, dll exe,
# static exe, and a source tarball -- and none of the binaries installs unattended on a
# runner.  The remaining route is building ImageMagick from source inside CI, which is
# out of proportion to this project.
#
# TO MAKE THIS WORK, one of:
#   * a cached runner image with a dev install of ImageMagick (a custom
#     actions/runner-image, or a self-hosted runner);
#   * build ImageMagick from source as a first CI step;
#   * accept a prebuilt rdither and run only the probes.
#
# WHY THIS EXISTS AT ALL, and it is not "to be professional".
#
# Five defects were found in one session, and every one of them had the same cause:
# a build configuration that nobody had ever run.  A clean clone did not link.
# `build.cmd --no-cuda` did not compile.  Three separate scripts reported an absent
# engine as a test FAILURE, so a CPU-only build exited 1 on a suite that was entirely
# green.  The OpenCL SDK was searched for in one directory while the comment beside it
# promised three others.  A documented .txt palette was rejected on the video path with
# a message that blamed the file.
#
# Every other check passed the whole time -- 135 bit-exact cases, anchors, 56
# documented flags, the licence byte-compare, a secrets sweep across every commit --
# and NOT ONE of them could have caught any of those five.  Only building a clean
# clone could.  This workflow builds a clean clone on every push, on a machine that is
# not the one the code was written on.
#
# WHAT THIS RUNS ON, and why it is the right shape.  GitHub's hosted Windows runners
# have NO GPU and NO OpenCL SDK, which is precisely the configuration that was broken
# three separate ways.  That is not a limitation worked around; it is the reason this
# catches things.  What it therefore CANNOT do is run the OpenCL-vs-CUDA sweep or the
# video probes, and it does not pretend to: those report as skipped, which is a
# distinct outcome from passing and is never counted as a pass.
#
# COSTS about 6-8 minutes per push.  If that is too much, delete the cuda job -- the
# nocuda job alone catches three of the five defects, and the cuda job is the one
# that only checks compilation.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run in progress.  Without this, a burst of
# commits queues five six-minute builds to answer a question the newest commit already
# answers.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nocuda:
    # The highest-value job in this file, and the one to keep if you keep only one.
    # No GPU on the runner, so this takes exactly the code path that failed to link.
    name: build + verify (no CUDA, no OpenCL SDK)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick 7.1.2-31 Q16-HDRI
        shell: pwsh
        # The DLL INSTALLER, run with a bounded wait.  Three other approaches were
        # tried and measured, all recorded here because the reasons are not obvious:
        #
        #   1. the installer with plain Start-Process -Wait   -> HUNG.  /S was ignored
        #      and it sat for the full 30-minute job timeout; the runner reported
        #      "Terminate orphan process: pid (4444) (im-setup)".  Never reached a build.
        #   2. the portable .7z                             -> extracts cleanly in 0.9s
        #      but is RUNTIME ONLY: 23 loose files, magick.exe and XML, with no
        #      include/ and no lib/ at all.  It cannot build against.
        #   3. 7z x on the installer .exe                    -> extracts the NSIS
        #      bootstrap only; no MagickCore.h, no import library.  The payload is in
        #      an embedded blob 7z does not unpack.
        #
        # So the installer is the only form that carries headers and a .lib, and the
        # only thing that can go wrong is that it does not exit.  Hence the bounded
        # wait: kill it after 180s and fail loudly, rather than burning the job.
        #
        # Pinned to the EXACT version every bit-exactness number here was measured
        # against, deliberately rather than to "latest" -- a Q8 build compiles and then
        # fails every comparison, and "latest" would let a new release turn a green
        # build red with nothing in the repository having changed.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tag = '7.1.2-31'
          $asset = "ImageMagick-$tag-Q16-HDRI-x64-dll.exe"
          $url = "https://github.com/ImageMagick/ImageMagick/releases/download/$tag/$asset"
          Write-Host "fetching $url"
          Invoke-WebRequest -Uri $url -OutFile im-setup.exe -UseBasicParsing -TimeoutSec 900
          $dest = 'C:\im'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }

          Write-Host "starting the installer with a 180s bound"
          # THIS IS THE FIX, and it took four CI runs to find.  /S and /D are passed
          # through `cmd /c` rather than as a Start-Process argument array.
          #
          # Start-Process -ArgumentList re-quotes each array element, so "/D=C:\im"
          # can reach NSIS quoted or split.  NSIS requires /D to be the LAST argument
          # and UNQUOTED; when it is not, the installer does not fail -- it opens a
          # directory prompt and waits for a human, which is why every earlier attempt
          # appeared to "ignore /S".  The symptom was a job killed at its 30-minute
          # timeout with `im-setup` named as an orphaned process.
          #
          # Verified on this machine before it was pushed here: the same installer
          # with `/c` completes in 23.9s and exit 0.  Through -ArgumentList it ran
          # past 240s.  It installs to its default C:\Program Files location, which is
          # also build.cmd's first guess, and the search below finds either.
          $p = Start-Process -FilePath 'cmd.exe' `
                -ArgumentList "/c `"im-setup.exe`" /S /D=$dest" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) {
            Write-Host "installer still running after 180s; killing it"
            try { $p.Kill() } catch { }
            throw 'the ImageMagick installer did not exit. /S and /D go through cmd /c,'
          }
          Write-Host "installer exit code: $($p.ExitCode)"

          # Find the root by CONTENT, not by assuming /D was honoured.  The first
          # version of this built a candidate list as @(String, DirectoryInfo) and read
          # .FullName off both, a Join-Path type error on the String; the second
          # assumed a wrapper directory that a portable archive does not have.  Both
          # files are asserted by name so a wrong pick is one line of log rather than a
          # link error twenty steps later.
          $cands = @($dest, "${env:ProgramFiles}\ImageMagick-7.1.2-Q16-HDRI")
          $root = $null
          foreach ($c in $cands) {
            if (Test-Path (Join-Path $c 'include\MagickCore\MagickCore.h')) { $root = $c; break }
          }
          if (-not $root) {
            Write-Host "searching for MagickCore.h under C:\ :"
            Get-ChildItem C:\ -Directory -EA SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "no include\MagickCore\MagickCore.h under any known location"
          }
          $lib = Join-Path $root 'lib\CORE_RL_MagickCore_.lib'
          if (-not (Test-Path $lib)) {
            Write-Host "lib\ under $root :"
            Get-ChildItem (Join-Path $root 'lib') -EA SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "no CORE_RL_MagickCore_.lib at $lib -- this is the Q8 or non-MSVC build"
          }
          Write-Host "ImageMagick root: $root"
          "IM_ROOT=$root" >> $env:GITHUB_ENV
          # build.cmd reads IMAGEMAGICK_ROOT, and this is the only step that knows
          # where the installer actually landed.  Without it the nocuda job falls back
          # to build.cmd's hardcoded C:\Program Files path, which does exist on a hosted
          # runner but is a DIFFERENT and older ImageMagick -- or nothing at all.
          "IMAGEMAGICK_ROOT=$root" >> $env:GITHUB_ENV

      - name: Report the toolchain actually used
        shell: pwsh
        run: |
          & "$env:IM_ROOT\magick.exe" --version
          cmake --version
          # Recorded in the log because a green run on an unexpected toolchain is not
          # the same evidence as a green run on the expected one.
          Write-Host "runner: $env:RUNNER_OS $env:RUNNER_ARCH"

      - name: Build (CPU only)
        shell: cmd
        run: build.cmd --no-cuda

      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:IM_ROOT\magick.exe" --version
          $env:MAGICK_HOME = $env:IM_ROOT
          $env:PATH = "$env:IM_ROOT;$env:PATH"
          & pwsh -NoProfile -File .\verify.ps1
          $code = $LASTEXITCODE
          Write-Host "verify.ps1 exit=$code"
          if ($code -ne 0) { exit $code }

      - name: Assert the skipped checks are the expected ones
        shell: pwsh
        # Guards against a silent hole.  verify.ps1 reports a check it cannot run as
        # skipped, and a skipped check is not a pass -- but that convention also means
        # a suite could skip EVERYTHING and exit 0, which would be a green light that
        # means "I looked away".  So the count of real passes is asserted here, and it
        # is asserted to be the number the no-CUDA configuration can actually produce.
        #
        # 90, not 135: 9 images x 5 colour counts x 3 engines is 135, and the cuda
        # engine's 45 are skipped on a runner with no GPU.  If someone later fixes the
        # engine reporting, this number goes UP and the assertion has to be updated --
        # which is the intended direction to be forced into noticing.
        run: |
          $log = 'verify.log'
          & pwsh -NoProfile -File .\verify.ps1 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host "verify.ps1 FAILED (exit $code)"; exit $code }
          $text = Get-Content $log -Raw
          $m = [regex]::Match($text, 'bit-exact cases:\s*(\d+) passed,\s*(\d+) failed(?:,\s*(\d+) SKIPPED)?')
          if (-not $m.Success) { Write-Host "could not find the bit-exact tally in the output"; exit 1 }
          $passed = [int]$m.Groups[1].Value
          $failed = [int]$m.Groups[2].Value
          Write-Host "tally: $passed passed, $failed failed"
          if ($failed -ne 0) { exit 1 }
          if ($passed -lt 80) {
            Write-Host "only $passed cases ran -- that is far below the 90 this configuration can do."
            Write-Host "A suite that skips nearly everything and exits 0 is worse than a failing one."
            exit 1
          }
          Write-Host "OK: $passed real bit-exact cases passed on a GPU-less runner"

  cuda:
    # Compilation only in practice: nvcc compiles and links without a device, so this
    # verifies the CUDA build is not broken, and then verify.ps1 reports the GPU checks
    # as skipped.  Kept separate from the job above so that a CUDA toolchain problem
    # does not hide a plain C++ problem, and so either can be dropped independently.
    name: build (CUDA toolkit, no GPU)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick 7.1.2-31 Q16-HDRI
        shell: pwsh
        # Installer with a bounded wait; the three rejected alternatives and why are
        # recorded on the same step in the nocuda job above.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tag = '7.1.2-31'
          $asset = "ImageMagick-$tag-Q16-HDRI-x64-dll.exe"
          Invoke-WebRequest -Uri "https://github.com/ImageMagick/ImageMagick/releases/download/$tag/$asset" -OutFile im-setup.exe -UseBasicParsing -TimeoutSec 900
          $dest = 'C:\im'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          # Through cmd /c, not a Start-Process argument array -- see the long note on the
          # same step in the nocuda job.  NSIS needs /D last and unquoted, and
          # -ArgumentList re-quotes array elements, which turns a silent install into a
          # GUI prompt that waits for a human until the job times out.
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList "/c `"im-setup.exe`" /S /D=$dest" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) {
            try { $p.Kill() } catch { }
            throw 'the ImageMagick installer did not exit within 180s'
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          $root = $null
          foreach ($c in @($dest, "${env:ProgramFiles}\ImageMagick-7.1.2-Q16-HDRI")) {
            if (Test-Path (Join-Path $c 'include\MagickCore\MagickCore.h')) { $root = $c; break }
          }
          if (-not $root) { throw "no include\MagickCore\MagickCore.h under any known location" }
          if (-not (Test-Path (Join-Path $root 'lib\CORE_RL_MagickCore_.lib'))) { throw "no MSVC import library under $root" }
          Write-Host "ImageMagick root: $root"
          "IM_ROOT=$root" >> $env:GITHUB_ENV
          "IMAGEMAGICK_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install the CUDA toolkit
        shell: pwsh
        # The hosted runners have MSBuild and the VS C++ workload but NOT nvcc, and
        # `find_package(CUDAToolkit REQUIRED)` in CMakeLists.txt makes its absence a
        # configure error rather than a graceful skip.
        #
        # These are the component REDIST archives, not the 4 GB installer, so each URL
        # was read out of NVIDIA's own manifest for 12.8.1 and then fetched to confirm
        # it resolves:
        #   https://developer.download.nvidia.com/compute/cuda/redist/redistrib_12.8.1.json
        # A hand-written guess at this path 404s.  The version numbers are the
        # component versions WITHIN the 12.8.1 release, which is why nvcc is 12.8.93
        # and not 12.8.1 -- that mismatch looks like a typo and is not one.
        #
        # cuda_cccl is included because nvcc's own headers include thrust/cub, so a
        # toolkit without it fails at compile time rather than at configure time.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $parts = @(
            'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.8.93-archive.zip',
            'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.8.90-archive.zip',
            'cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.8.90-archive.zip'
          )
          $stage = "$env:RUNNER_TEMP\cuda"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($p in $parts) {
            $name = ($p -split '/')[-1]
            Write-Host "fetching $name"
            Invoke-WebRequest -Uri "$base/$p" -OutFile "$env:RUNNER_TEMP\$name" -UseBasicParsing -TimeoutSec 1800
            # Each archive unpacks to its own versioned directory; merge them all into
            # one root, because that is the shape find_package(CUDAToolkit) expects.
            $dest = Join-Path $stage ([IO.Path]::GetFileNameWithoutExtension($name) -replace '-archive$','')
            Expand-Archive -Path "$env:RUNNER_TEMP\$name" -DestinationPath $dest -Force
          }
          $root = Get-ChildItem $stage -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName 'bin\nvcc.exe') } |
                  Select-Object -First 1
          if (-not $root) {
            Get-ChildItem $stage -Recurse -Filter 'nvcc.exe' | ForEach-Object { Write-Host "  found nvcc at $($_.FullName)" }
            throw 'nvcc.exe not found in any unpacked component'
          }
          Write-Host "CUDA root: $($root.FullName)"
          "CUDA_PATH=$($root.FullName)" >> $env:GITHUB_ENV
          ("{0}\bin" -f $root.FullName) >> $env:GITHUB_PATH
          ("{0}\lib\x64" -f $root.FullName) >> $env:GITHUB_PATH
          ("{0}\include" -f $root.FullName) >> $env:GITHUB_PATH
          & (Join-Path $root.FullName 'bin\nvcc.exe') --version

      - name: Build (CUDA)
        shell: cmd
        # No env: block.  IMAGEMAGICK_ROOT is already in GITHUB_ENV from the install
        # step, set to the root the archive actually unpacked to.  Hardcoding C:\im
        # here was wrong the moment the portable archive was adopted, because that is
        # the extraction target, not necessarily the root inside it.
        run: build.cmd

      - name: Report what this run could and could not check
        shell: pwsh
        run: |
          Write-Host "This job has the CUDA toolkit but NO GPU."
          Write-Host "It proves the CUDA build compiles and links.  It cannot run the"
          Write-Host "OpenCL-vs-CUDA sweep or the video probes, and those stay manual."
          & .\build\Release\rdither.exe --list-dithers
