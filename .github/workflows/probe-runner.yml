name: probe-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: inspect the chocolatey package without installing it
        shell: pwsh
        run: |
          Write-Host "--- package info ---"
          & choco info imagemagick --limit-output 2>&1 | Select-Object -First 12 | ForEach-Object { Write-Host "  $_" }
          Write-Host "--- is it the Q16-HDRI MSVC dll build? (check the nuspec/install script) ---"
          $tmp = "$env:RUNNER_TEMP\impkg"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          & choco download imagemagick --internalize --output-directory $tmp --no-progress 2>&1 |
            Select-Object -Last 3 | ForEach-Object { Write-Host "  $_" }
          Get-ChildItem $tmp -Recurse -EA SilentlyContinue | Select-Object -First 12 |
            ForEach-Object { Write-Host "  $($_.Name)" }